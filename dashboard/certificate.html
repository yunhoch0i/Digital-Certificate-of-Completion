<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASBG 수료 인증서</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --aws-orange: #FF9900; --aws-dark: #232F3E; }

    body { background: #f8f9fa; font-family: 'Segoe UI', sans-serif; }

    /* 역할 배지 */
    .badge-leader      { background:#FFF3CD; color:#856404; border:1px solid #FFEAA7; }
    .badge-core-member { background:#CCE5FF; color:#004085; border:1px solid #B8DAFF; }
    .badge-member      { background:#E2E3E5; color:#383D41; border:1px solid #D6D8DB; }

    /* 멤버 카드 */
    .member-card {
      background: white;
      border-radius: 12px;
      border: 2px solid #e5e7eb;
      padding: 1.25rem;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .member-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
    .member-card.certified {
      border-color: #FF9900;
      box-shadow: 0 0 0 1px rgba(255,153,0,0.3);
    }
    .member-card.certified:hover { box-shadow: 0 8px 24px rgba(255,153,0,0.25); }

    /* 출석 진행 바 */
    .progress-bar { height: 6px; background: #e5e7eb; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; transition: width 0.6s ease; }
    .progress-fill.pass { background: #22c55e; }
    .progress-fill.fail { background: #94a3b8; }

    /* 수료 배지 */
    .cert-badge-pass { background:#DCFCE7; color:#166534; border:1px solid #BBF7D0; }
    .cert-badge-fail { background:#F1F5F9; color:#64748B; border:1px solid #E2E8F0; }

    /* 모달 */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; padding: 1rem;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: white; border-radius: 16px;
      max-width: 540px; width: 100%;
      transform: scale(0.95); transition: transform 0.2s;
      max-height: 90vh; overflow-y: auto;
    }
    .modal-overlay.open .modal-box { transform: scale(1); }

    /* 수료 인증서 카드 디자인 */
    .certificate-card {
      border: 3px solid #FF9900;
      border-radius: 12px;
      padding: 2rem;
      background: linear-gradient(135deg, #fffdf7 0%, #fff8ec 100%);
      position: relative;
      text-align: center;
    }
    .certificate-card::before {
      content: '';
      position: absolute; inset: 6px;
      border: 1px solid rgba(255,153,0,0.3);
      border-radius: 8px; pointer-events: none;
    }

    /* 섹션 구분선 */
    .section-header {
      display: flex; align-items: center; gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .section-line { flex: 1; height: 2px; background: #e5e7eb; border-radius: 99px; }

    /* 로딩 스피너 */
    .spinner {
      width: 40px; height: 40px; border: 4px solid #e5e7eb;
      border-top-color: #FF9900; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ── 헤더 ─────────────────────────────────────────────────────────────── -->
<header style="background:var(--aws-dark);" class="text-white px-6 py-5">
  <div class="max-w-5xl mx-auto flex items-center justify-between flex-wrap gap-3">
    <div>
      <div class="flex items-center gap-2 mb-1">
        <span class="text-2xl">🏆</span>
        <h1 class="text-xl font-bold">ASBG 수료 인증서</h1>
      </div>
      <p class="text-sm text-gray-400">AWS Student Builders Group</p>
    </div>
    <div class="flex items-center gap-3">
      <div id="header-stats" class="text-right text-sm text-gray-400 hidden">
        <div id="stat-sessions"></div>
        <div id="stat-certified"></div>
      </div>
      <a href="/dashboard.html"
         class="text-sm px-4 py-2 rounded-lg border border-gray-600 hover:border-gray-400 transition-colors">
        ← 대시보드
      </a>
    </div>
  </div>
</header>

<!-- ── 메인 콘텐츠 ─────────────────────────────────────────────────────── -->
<main class="max-w-5xl mx-auto px-4 py-8">

  <!-- 로딩 -->
  <div id="loading" class="flex flex-col items-center justify-center py-24 gap-4">
    <div class="spinner"></div>
    <p class="text-gray-500">블록체인에서 데이터를 불러오는 중...</p>
  </div>

  <!-- 에러 -->
  <div id="error-view" class="hidden text-center py-24">
    <p class="text-4xl mb-3">⚠️</p>
    <p class="text-gray-600" id="error-msg"></p>
    <button onclick="load()" class="mt-4 px-5 py-2 rounded-lg text-sm font-medium"
            style="background:var(--aws-orange); color:white;">다시 시도</button>
  </div>

  <!-- 멤버 목록 -->
  <div id="members-view" class="hidden space-y-10">

    <!-- Leader -->
    <section id="section-leader" class="hidden">
      <div class="section-header">
        <span class="text-base font-bold text-amber-600 whitespace-nowrap">👑 Leader</span>
        <div class="section-line"></div>
        <span id="count-leader" class="text-sm text-gray-400 whitespace-nowrap"></span>
      </div>
      <div id="grid-leader" class="grid gap-4" style="grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));"></div>
    </section>

    <!-- Core Member -->
    <section id="section-core-member" class="hidden">
      <div class="section-header">
        <span class="text-base font-bold text-blue-600 whitespace-nowrap">⭐ Core Member</span>
        <div class="section-line"></div>
        <span id="count-core-member" class="text-sm text-gray-400 whitespace-nowrap"></span>
      </div>
      <div id="grid-core-member" class="grid gap-4" style="grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));"></div>
    </section>

    <!-- Member -->
    <section id="section-member" class="hidden">
      <div class="section-header">
        <span class="text-base font-bold text-gray-600 whitespace-nowrap">👤 Member</span>
        <div class="section-line"></div>
        <span id="count-member" class="text-sm text-gray-400 whitespace-nowrap"></span>
      </div>
      <div id="grid-member" class="grid gap-4" style="grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));"></div>
    </section>

  </div>
</main>

<!-- ── 모달 ─────────────────────────────────────────────────────────────── -->
<div id="modal" class="modal-overlay" onclick="closeModal(event)">
  <div class="modal-box p-6" onclick="event.stopPropagation()">
    <div class="flex justify-end mb-2">
      <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 text-xl leading-none">✕</button>
    </div>
    <div id="modal-content"></div>
  </div>
</div>

<script>
  const CONTRACT_ADDR = '0xF5E07d95461f076BF7567666eAf354ba4460953a';
  let allMembers = [];

  // ── 데이터 로드 ─────────────────────────────────────────────────────────
  async function load() {
    show('loading');
    try {
      const res = await fetch('/certificates');
      if (!res.ok) throw new Error(`서버 오류 (${res.status})`);
      allMembers = await res.json();
      renderAll(allMembers);
      show('members-view');
    } catch (e) {
      document.getElementById('error-msg').textContent = e.message;
      show('error-view');
    }
  }

  function show(id) {
    ['loading','error-view','members-view'].forEach(s =>
      document.getElementById(s).classList.toggle('hidden', s !== id)
    );
  }

  // ── 렌더링 ──────────────────────────────────────────────────────────────
  function renderAll(members) {
    const groups = { 'Leader': [], 'Core Member': [], 'Member': [] };
    members.forEach(m => (groups[m.role] || groups['Member']).push(m));

    const totalCertified = members.filter(m => m.certified).length;
    const totalSessions  = members[0]?.total_sessions ?? 0;
    const threshold      = members[0]?.threshold ?? 0;

    document.getElementById('stat-sessions').textContent =
      `전체 ${totalSessions}회 | 수료 기준 ${threshold}회 (90%)`;
    document.getElementById('stat-certified').textContent =
      `수료 ${totalCertified}명 / 전체 ${members.length}명`;
    document.getElementById('header-stats').classList.remove('hidden');

    renderSection('leader',      groups['Leader']);
    renderSection('core-member', groups['Core Member']);
    renderSection('member',      groups['Member']);
  }

  function renderSection(key, members) {
    const section = document.getElementById(`section-${key}`);
    const grid    = document.getElementById(`grid-${key}`);
    const count   = document.getElementById(`count-${key}`);
    if (!members.length) return;

    const certified = members.filter(m => m.certified).length;
    count.textContent = `${certified}명 수료 / ${members.length}명`;
    grid.innerHTML = members.map(m => cardHTML(m)).join('');
    section.classList.remove('hidden');
  }

  function cardHTML(m) {
    const pct   = m.total_sessions > 0 ? Math.round(m.attendance / m.total_sessions * 100) : 0;
    const pass  = m.certified;
    const badge = roleBadge(m.role);
    return `
      <div class="member-card ${pass ? 'certified' : ''}" onclick="openModal(${m.id})">
        ${pass ? '<div class="absolute top-2 right-2 text-lg">🏆</div>' : ''}
        <div class="text-center mb-3">
          <div class="text-3xl mb-2">${roleIcon(m.role)}</div>
          <div class="font-bold text-gray-900 text-sm">${m.name}</div>
          <span class="inline-block mt-1 text-xs px-2 py-0.5 rounded-full font-medium ${badge}">${m.role}</span>
        </div>
        <div class="mb-1 flex justify-between text-xs text-gray-500">
          <span>출석</span>
          <span class="font-medium">${m.attendance} / ${m.total_sessions}</span>
        </div>
        <div class="progress-bar mb-3">
          <div class="progress-fill ${pass ? 'pass' : 'fail'}" style="width:${pct}%"></div>
        </div>
        <div class="text-center">
          <span class="text-xs px-3 py-1 rounded-full font-semibold ${pass ? 'cert-badge-pass' : 'cert-badge-fail'}">
            ${pass ? '✅ 수료' : '❌ 미수료'}
          </span>
        </div>
      </div>`;
  }

  // ── 모달 ────────────────────────────────────────────────────────────────
  function openModal(id) {
    const m = allMembers.find(x => x.id === id);
    if (!m) return;
    document.getElementById('modal-content').innerHTML = m.certified
      ? certifiedModal(m)
      : notCertifiedModal(m);
    document.getElementById('modal').classList.add('open');
    document.body.style.overflow = 'hidden';

    // 수료자 → IPFS 메타데이터 비동기 로드
    if (m.certified && m.token_uri) fetchIpfsMeta(m);
  }

  function closeModal(e) {
    if (e && e.target !== document.getElementById('modal')) return;
    document.getElementById('modal').classList.remove('open');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  function certifiedModal(m) {
    const etherscanUrl = `https://sepolia.etherscan.io/token/${CONTRACT_ADDR}?a=${m.token_id}`;
    const openseaUrl   = `https://testnets.opensea.io/assets/sepolia/${CONTRACT_ADDR}/${m.token_id}`;
    const pct = m.total_sessions > 0 ? Math.round(m.attendance / m.total_sessions * 100) : 0;
    return `
      <div class="certificate-card mb-5">
        <div class="text-xs text-gray-400 font-semibold tracking-widest uppercase mb-3">AWS Student Builders Group</div>
        <div class="text-lg font-bold text-gray-700 mb-1">ASBG 수료 인증서</div>
        <div class="w-12 h-0.5 mx-auto mb-4" style="background:var(--aws-orange);"></div>
        <div class="text-3xl font-bold text-gray-900 mb-1">${m.name}</div>
        <span class="inline-block text-sm px-3 py-1 rounded-full font-medium mb-5 ${roleBadge(m.role)}">${m.role}</span>
        <div class="grid grid-cols-2 gap-3 text-sm text-left mb-4">
          <div class="bg-white rounded-lg p-3 border border-amber-100">
            <div class="text-gray-400 text-xs mb-0.5">출석 횟수</div>
            <div class="font-bold text-gray-800">${m.attendance} / ${m.total_sessions}</div>
          </div>
          <div class="bg-white rounded-lg p-3 border border-amber-100">
            <div class="text-gray-400 text-xs mb-0.5">수료 기준</div>
            <div class="font-bold text-gray-800">${m.threshold}회 이상</div>
          </div>
          <div class="bg-white rounded-lg p-3 border border-amber-100">
            <div class="text-gray-400 text-xs mb-0.5">Token ID</div>
            <div class="font-bold text-gray-800">#${m.token_id}</div>
          </div>
          <div class="bg-white rounded-lg p-3 border border-amber-100" id="modal-date-box">
            <div class="text-gray-400 text-xs mb-0.5">발급일</div>
            <div class="font-bold text-gray-800" id="modal-issued-date">로딩 중...</div>
          </div>
        </div>
        <div class="mb-1 flex justify-between text-xs text-gray-500">
          <span>출석률</span><span>${pct}%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill pass" style="width:${pct}%"></div>
        </div>
      </div>
      <div class="flex gap-3">
        <a href="${etherscanUrl}" target="_blank" rel="noopener"
           class="flex-1 text-center text-sm py-2.5 rounded-lg font-medium border border-gray-300 hover:border-gray-500 transition-colors text-gray-700">
          🔗 Etherscan
        </a>
        <a href="${openseaUrl}" target="_blank" rel="noopener"
           class="flex-1 text-center text-sm py-2.5 rounded-lg font-medium text-white transition-colors"
           style="background:var(--aws-orange);">
          🖼 OpenSea
        </a>
      </div>`;
  }

  function notCertifiedModal(m) {
    const pct  = m.total_sessions > 0 ? Math.round(m.attendance / m.total_sessions * 100) : 0;
    const lack = Math.max(0, m.threshold - m.attendance);
    return `
      <div class="text-center py-4">
        <div class="text-4xl mb-3">${roleIcon(m.role)}</div>
        <div class="text-xl font-bold text-gray-900 mb-1">${m.name}</div>
        <span class="inline-block text-xs px-3 py-1 rounded-full font-medium mb-6 ${roleBadge(m.role)}">${m.role}</span>
        <div class="bg-gray-50 rounded-xl p-5 mb-5 text-left">
          <div class="grid grid-cols-3 gap-3 text-center text-sm mb-4">
            <div>
              <div class="text-gray-400 text-xs mb-0.5">현재 출석</div>
              <div class="font-bold text-gray-800 text-lg">${m.attendance}</div>
            </div>
            <div>
              <div class="text-gray-400 text-xs mb-0.5">수료 기준</div>
              <div class="font-bold text-gray-800 text-lg">${m.threshold}</div>
            </div>
            <div>
              <div class="text-gray-400 text-xs mb-0.5">부족</div>
              <div class="font-bold text-red-500 text-lg">${lack}</div>
            </div>
          </div>
          <div class="mb-1 flex justify-between text-xs text-gray-500">
            <span>출석률</span><span>${pct}%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill fail" style="width:${pct}%"></div>
          </div>
        </div>
        <p class="text-sm text-gray-500">아직 수료 기준(${m.threshold}회)을 달성하지 못했습니다.</p>
      </div>`;
  }

  // ── IPFS 메타데이터 비동기 로드 ─────────────────────────────────────────
  async function fetchIpfsMeta(m) {
    try {
      const cid = m.token_uri.replace('ipfs://', '');
      const res = await fetch(`https://ipfs.io/ipfs/${cid}`);
      if (!res.ok) return;
      const meta = await res.json();
      const issuedAttr = meta.attributes?.find(a => a.trait_type === 'issued_date');
      const el = document.getElementById('modal-issued-date');
      if (el) el.textContent = issuedAttr?.value ?? '—';
    } catch { /* IPFS fetch 실패 시 무시 */ }
  }

  // ── 유틸 ────────────────────────────────────────────────────────────────
  function roleBadge(role) {
    if (role === 'Leader')      return 'badge-leader';
    if (role === 'Core Member') return 'badge-core-member';
    return 'badge-member';
  }
  function roleIcon(role) {
    if (role === 'Leader')      return '👑';
    if (role === 'Core Member') return '⭐';
    return '👤';
  }

  load();
</script>
</body>
</html>
