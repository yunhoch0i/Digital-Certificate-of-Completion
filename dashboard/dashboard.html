<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASBG 출석 대시보드</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

    header {
      background: linear-gradient(135deg, #1e40af, #7c3aed);
      padding: 1.5rem 2rem;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.05em; }
    header span { font-size: 0.85rem; opacity: 0.8; }

    .container { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }

    .card {
      background: #1e293b; border-radius: 12px;
      padding: 1.5rem; margin-bottom: 1.5rem;
      border: 1px solid #334155;
    }
    .card h2 { font-size: 0.85rem; font-weight: 600; color: #94a3b8; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.08em; }

    .fields { display: flex; gap: 1rem; flex-wrap: wrap; }
    .fields label { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.85rem; color: #94a3b8; flex: 1; min-width: 200px; }
    .fields input {
      background: #0f172a; border: 1px solid #475569; border-radius: 8px;
      padding: 0.6rem 0.9rem; color: #e2e8f0; font-size: 0.95rem;
    }
    .fields input:focus { outline: none; border-color: #6366f1; }

    .bulk-actions { display: flex; gap: 0.6rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .bulk-btn { padding: 0.4rem 1rem; border-radius: 6px; border: none; cursor: pointer; font-size: 0.82rem; font-weight: 600; transition: opacity 0.15s; }
    .bulk-btn:hover { opacity: 0.85; }
    .bulk-btn.all-present { background: #16a34a; color: #fff; }
    .bulk-btn.all-absent  { background: #dc2626; color: #fff; }
    .bulk-btn.reset       { background: #475569; color: #fff; }

    .stats { display: flex; gap: 1.5rem; margin-bottom: 0.5rem; font-size: 0.85rem; }
    .stats span { color: #94a3b8; }
    .stats b { color: #e2e8f0; }
    #unchecked-warning { font-size: 0.82rem; color: #fbbf24; min-height: 1.2em; margin-bottom: 0.5rem; }

    #member-list { display: flex; flex-direction: column; gap: 0.5rem; }
    #loading { display: none; text-align: center; padding: 2rem; color: #94a3b8; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #334155; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 0.4rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .member-row {
      display: flex; align-items: center; gap: 0.75rem;
      background: #0f172a; border-radius: 8px; padding: 0.6rem 1rem;
      border: 1px solid #1e293b; transition: border-color 0.15s;
    }
    .member-row.present { border-color: #16a34a; }
    .member-row.absent  { border-color: #dc2626; }
    .member-row .idx    { font-size: 0.72rem; color: #475569; min-width: 22px; text-align: right; }
    .member-row .name   { flex: 1; font-size: 0.95rem; font-weight: 500; }
    .member-row .role   { font-size: 0.78rem; color: #94a3b8; min-width: 90px; }
    .member-row .att    { font-size: 0.82rem; color: #7c3aed; min-width: 52px; text-align: right; }

    .toggle-btn { padding: 0.35rem 1rem; border-radius: 6px; border: none; cursor: pointer; font-size: 0.82rem; font-weight: 700; min-width: 56px; transition: background 0.12s; }
    .toggle-btn.present   { background: #16a34a; color: #fff; }
    .toggle-btn.absent    { background: #dc2626; color: #fff; }
    .toggle-btn.unchecked { background: #334155; color: #94a3b8; }

    #submit-btn { width: 100%; padding: 0.9rem; border-radius: 10px; border: none; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s; background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; }
    #submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #result { display: none; }
    .result-success { color: #4ade80; margin-bottom: 0.5rem; }
    .result-failed  { color: #f87171; margin-top: 0.75rem; margin-bottom: 0.5rem; }
    .result-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 0.5rem; }
    .result-table th, .result-table td { text-align: left; padding: 0.4rem 0.75rem; border-bottom: 1px solid #334155; }
    .result-table th { color: #94a3b8; font-weight: 600; }
    .tx-link a { color: #818cf8; font-family: monospace; font-size: 0.78rem; }
  </style>
</head>
<body>

<header>
  <h1>ASBG 출석 대시보드</h1>
  <span>AWS Student Builders Group — 운영진 전용</span>
</header>

<div class="container">

  <div class="card">
    <h2>모임 정보</h2>
    <div class="fields">
      <label>모임 날짜 <input type="date" id="event-date" /></label>
      <label>모임 이름 <input type="text" id="event-name" placeholder="예) 5월 정기 모임" /></label>
    </div>
  </div>

  <div class="card">
    <h2>출석 체크</h2>
    <div class="bulk-actions">
      <button class="bulk-btn all-present" onclick="setAll('present')">전체 출석</button>
      <button class="bulk-btn all-absent"  onclick="setAll('absent')">전체 결석</button>
      <button class="bulk-btn reset"       onclick="resetAll()">초기화</button>
    </div>
    <div class="stats">
      <span>출석: <b id="cnt-present">0</b></span>
      <span>결석: <b id="cnt-absent">0</b></span>
      <span>미체크: <b id="cnt-unchecked">0</b></span>
    </div>
    <div id="unchecked-warning"></div>
    <div id="loading"><span class="spinner"></span>멤버 목록 로딩 중...</div>
    <div id="member-list"></div>
  </div>

  <div class="card">
    <button id="submit-btn" disabled onclick="submitAttendance()">출석 제출 및 민팅</button>
  </div>

  <div class="card" id="result">
    <h2>민팅 결과</h2>
    <div id="result-body"></div>
  </div>

</div>

<script>
  const API = '';
  let memberList = [];

  async function loadMembers() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('member-list').innerHTML = '';
    try {
      const res = await fetch(`${API}/members`);
      if (!res.ok) throw new Error(await res.text());
      memberList = await res.json();
      renderMembers();
    } catch (e) {
      document.getElementById('member-list').innerHTML =
        `<p style="color:#f87171">멤버 로드 실패: ${e.message}</p>`;
    } finally {
      document.getElementById('loading').style.display = 'none';
    }
  }

  function renderMembers() {
    const list = document.getElementById('member-list');
    list.innerHTML = '';
    memberList.forEach((m) => {
      const row = document.createElement('div');
      row.className = 'member-row';
      row.dataset.id = m.id;
      row.innerHTML = `
        <div class="idx">#${m.id}</div>
        <div class="name">${m.name}</div>
        <div class="role">${m.role}</div>
        <div class="att">${m.attendance} 회</div>
        <button class="toggle-btn unchecked" onclick="toggle(${m.id})">-</button>
      `;
      list.appendChild(row);
      m._status = 'unchecked';
    });
    updateStats();
  }

  function toggle(id) {
    const m = memberList.find(x => x.id === id);
    const row = document.querySelector(`.member-row[data-id="${id}"]`);
    const btn = row.querySelector('.toggle-btn');
    if (m._status !== 'present') {
      m._status = 'present';
      row.className = 'member-row present';
      btn.className = 'toggle-btn present';
      btn.textContent = '출석';
    } else {
      m._status = 'absent';
      row.className = 'member-row absent';
      btn.className = 'toggle-btn absent';
      btn.textContent = '결석';
    }
    updateStats();
  }

  function setAll(status) {
    memberList.forEach(m => {
      m._status = status;
      const row = document.querySelector(`.member-row[data-id="${m.id}"]`);
      const btn = row.querySelector('.toggle-btn');
      row.className = `member-row ${status}`;
      btn.className = `toggle-btn ${status}`;
      btn.textContent = status === 'present' ? '출석' : '결석';
    });
    updateStats();
  }

  function resetAll() {
    memberList.forEach(m => {
      m._status = 'unchecked';
      const row = document.querySelector(`.member-row[data-id="${m.id}"]`);
      const btn = row.querySelector('.toggle-btn');
      row.className = 'member-row';
      btn.className = 'toggle-btn unchecked';
      btn.textContent = '-';
    });
    updateStats();
  }

  function updateStats() {
    const present   = memberList.filter(m => m._status === 'present').length;
    const absent    = memberList.filter(m => m._status === 'absent').length;
    const unchecked = memberList.filter(m => m._status === 'unchecked').length;
    document.getElementById('cnt-present').textContent   = present;
    document.getElementById('cnt-absent').textContent    = absent;
    document.getElementById('cnt-unchecked').textContent = unchecked;
    const warn = document.getElementById('unchecked-warning');
    const btn  = document.getElementById('submit-btn');
    if (unchecked > 0) {
      warn.textContent = `⚠ 미체크 멤버 ${unchecked}명 — 모든 멤버를 체크해야 제출할 수 있습니다.`;
      btn.disabled = true;
    } else {
      warn.textContent = '';
      btn.disabled = false;
    }
  }

  async function submitAttendance() {
    const date = document.getElementById('event-date').value;
    const name = document.getElementById('event-name').value.trim();
    if (!date || !name) { alert('모임 날짜와 이름을 입력하세요.'); return; }

    const eventId = `${date}_${name.replace(/\s+/g, '-')}`;
    const present = memberList.filter(m => m._status === 'present').map(m => m.id);

    document.getElementById('submit-btn').disabled = true;
    document.getElementById('submit-btn').textContent = '민팅 중...';

    try {
      const res = await fetch(`${API}/mint`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ event_id: eventId, present }),
      });
      showResult(await res.json());
    } catch (e) {
      alert('요청 실패: ' + e.message);
    } finally {
      document.getElementById('submit-btn').disabled = false;
      document.getElementById('submit-btn').textContent = '출석 제출 및 민팅';
    }
  }

  function showResult(data) {
    const card = document.getElementById('result');
    const body = document.getElementById('result-body');
    card.style.display = 'block';
    let html = '';
    if (data.success?.length) {
      html += `<p class="result-success">✓ 민팅 성공 — ${data.success.length}명 (1 tx)</p>`;
      html += `<table class="result-table"><thead><tr><th>#</th><th>이름</th><th>Tx Hash</th></tr></thead><tbody>`;
      data.success.forEach(r => {
        html += `<tr>
          <td>${r.id}</td><td>${r.name}</td>
          <td class="tx-link"><a href="https://sepolia.etherscan.io/tx/${r.tx_hash}" target="_blank">${r.tx_hash.slice(0,20)}...</a></td>
        </tr>`;
      });
      html += '</tbody></table>';
    }
    if (data.failed?.length) {
      html += `<p class="result-failed">✗ 실패 ${data.failed.length}건</p>`;
      data.failed.forEach(r => {
        html += `<p style="color:#f87171;font-size:0.85rem">${r.error}</p>`;
      });
    }
    body.innerHTML = html;
    card.scrollIntoView({ behavior: 'smooth' });
    loadMembers();
  }

  loadMembers();
</script>
</body>
</html>
